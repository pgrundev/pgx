# Updates the existing Worker `pgx-install` (route pgx.dev/install). It keeps
# `curl -fsSL https://pgx.dev/install | sh` installing the previous product's
# last release, also after PGBoxDB releases exist (see legacy-install-worker.js).
name = "pgx-install"
main = "legacy-install-worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [
  { pattern = "pgx.dev/install", zone_name = "pgx.dev" },
]

[vars]
INSTALL_REF = "v0.1.3"
LEGACY_VERSION = "0.1.3"
