[package]
name = "pgboxdb"
version = "0.1.3"
edition.workspace = true
publish.workspace = true
description = "PGBoxDB command-line interface: a lightweight Postgres-compatible database runtime for AI agents"
homepage = "https://pgboxdb.com"
documentation = "https://pgbox.dev/db"
repository = "https://github.com/pgrundev/pgboxdb"

[[bin]]
name = "pgboxdb"
path = "src/main.rs"

[features]
# Test-only fault injection for PGBoxDB Git (`PGBOXDB_GIT_FAILPOINT`). Off in every
# release build; `cargo test -p pgboxdb --features failpoints --test git` uses it.
failpoints = []

[dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
# `pgboxdb top`: the terminal UI. Default features off: only the crossterm backend
# (no termion/termwiz, no serde, no underline-color/macros extras).
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
unicode-width = "0.2"

[dev-dependencies]
