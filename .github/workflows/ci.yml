name: CI
on:
  pull_request:
  push:
    branches: [main, prod]
# PR gate: fast correctness checks for the pgx CLI, the assembled distribution,
# the black-box SQL/clone/doctor suites, the installer, and the Docker image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker:
    name: pgx.dev /install Worker tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Worker unit tests (node:test)
        run: node --test dist/pgx.dev/install-worker.test.js
  npm:
    name: npm wrapper (pgxdb) tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - name: Unit + end-to-end tests against a local fake release (node:test)
        working-directory: dist/npm
        run: npm test
      - name: Pack (what npm would publish)
        working-directory: dist/npm
        run: npm pack --dry-run
  cli:
    name: fmt, clippy, unit + black-box (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # amd64 Linux, arm64 Linux (native runner), and arm64 macOS — the three
        # architectures PGX ships for. Each leg runs the full suite natively.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm architecture
        run: |
          echo "runner.os=${{ runner.os }} runner.arch=${{ runner.arch }}"
          echo "uname -m: $(uname -m)"
          echo "uname -a: $(uname -a)"
      - name: Install PostgreSQL 18 and RE2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget -qO /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18 libre2-dev pkg-config build-essential
          echo "PG18_BINDIR=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Install PostgreSQL 18 and RE2 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18 re2 pkg-config
          echo "PG18_BINDIR=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format and clippy (pgx crate)
        run: |
          cargo fmt -p pgx -- --check
          cargo clippy -p pgx --all-targets -- -D warnings
      - name: Build engine and CLI
        run: cargo build --release --locked --bin postgres --bin pgx
      - name: Assemble distribution
        # A 0.-prefixed prerelease version so dist.json (and `pgx version`) look
        # like a real build; the base `0.0.0-ci` prefixes the dist dir name used
        # by the Export PGX_DIST step below.
        run: dist/assemble.sh --out "$RUNNER_TEMP/rel" --version "0.0.0-ci.${{ github.sha }}" --pg-bindir "$PG18_BINDIR"
      - name: Unit tests
        # Only the crate's own unit tests here (no assembled dist); the
        # integration suites that need PGX_DIST run in "Black-box suites" below.
        run: cargo test -p pgx --release --bin pgx
        env: { PGX_DIST: "" }
      - name: Export PGX_DIST
        run: echo "PGX_DIST=$(find "$RUNNER_TEMP/rel" -maxdepth 1 -type d -name 'pgx-0.0.0-ci.*')" >> "$GITHUB_ENV"
      - name: Black-box suites
        run: |
          python3 -I tests/pgx/test_sql.py
          cargo test -p pgx --release --test lifecycle --test databases --test clone --test branch --test doctor --test run --test ttl --test copy
      - name: pgx top (real runtime + interactive PTY)
        run: cargo test -p pgx --release --test top --test top_tty
      - name: Agent lifecycle suites (pgx agent up/hook/exec/install)
        run: cargo test -p pgx --release --test agent --test agent_hook --test agent_exec --test agent_install --test agent_subagent
      - name: PGX Git suite (real Git repositories, hooks, worktrees, agents)
        run: |
          # With fault injection (failed/interrupted snapshot scenarios)...
          cargo test -p pgx --release --features failpoints --test git -- --nocapture
          # ...and the release configuration, which must not contain it.
          cargo test -p pgx --release --test git -- --nocapture
      - name: Skill end-to-end (real PGX, real PostgreSQL, skills CLI)
        run: PGX_BIN=target/release/pgx PG_BINDIR="$PG18_BINDIR" skills/tests/pgx/e2e.sh
      - name: Installer end-to-end
        run: dist/test/install_test.sh
      - name: Installer discovery/version/checksum/download tests
        run: dist/test/install_discovery_test.sh
      - name: npm wrapper end-to-end against the assembled distribution
        run: PGX_TARBALL_DIR="$RUNNER_TEMP/rel" dist/test/npm_test.sh
  skill:
    name: pgx Skill (validator, contract, discovery)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # the skills CLI needs fs/promises.glob (Node 22+)
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Official Agent Skills validator
        run: pipx run skills-ref validate skills/pgx
      - name: Skill contract and detection fixtures
        run: skills/tests/pgx/run.sh
      - name: Discovery with the skills CLI (local path, as the public install would see it)
        run: |
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj" && git init -q .
          npx -y skills@latest add "$GITHUB_WORKSPACE/skills/pgx" --list | tee list.txt
          grep -q 'pgx' list.txt
          npx -y skills@latest add "$GITHUB_WORKSPACE/skills/pgx" -a claude-code codex cursor -y
          test -f .claude/skills/pgx/SKILL.md && test -f .agents/skills/pgx/SKILL.md
          test ! -e .claude/skills/pgx/tests
  plugin:
    name: Claude Code plugin (marketplace, manifest, install cycle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install the Claude Code CLI (pinned; validate/install need no login)
        run: npm install -g @anthropic-ai/claude-code@2.1.310 && claude --version
      - name: Plugin package tests (drift, manifests, hygiene, isolated install cycle)
        run: plugins/tests/pgx/run.sh
      - name: Secret scan of the plugin package and marketplace (gitleaks)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          for d in plugins .claude-plugin skills; do ./gitleaks dir "$d" --no-banner --redact; done
  docker:
    name: Docker image (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Build and TTL-test the image natively on both amd64 and arm64 Linux.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm architecture
        run: |
          echo "runner.arch=${{ runner.arch }} uname -m: $(uname -m)"
          docker version --format '{{.Server.Arch}}' || true
      - name: Build and test the image
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-16 || true
          dist/test/docker_test.sh
