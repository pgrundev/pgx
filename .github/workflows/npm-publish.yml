name: Publish npm package (pgxdb)
# Publishes dist/npm as `pgxdb` to npm when a GitHub release is PUBLISHED (the
# draft that release.yml creates is published by hand; that is the trigger).
# The package version is stamped from the release tag, so `npx pgxdb@<v>`
# always installs the PGX <v> tarballs from that release.
#
# Guards against an accidental or unapproved publish:
#   - runs only in pgrundev/pgx (never in a fork);
#   - the release must be published (not a draft) and its tag must be
#     vX.Y.Z[-pre] on a commit that is on main;
#   - every supported platform's assets must exist, the package tests must
#     pass, and the packed tarball must run against the real release first;
#   - the publish job runs in the `npm-publish` GitHub environment — configure
#     required reviewers on it (Settings → Environments) for a human approval;
#   - manual runs default to dry_run=true (pack + verify, no publish).
#
# Auth: npm trusted publishing (OIDC) when the `pgxdb` package has this
# workflow configured as a trusted publisher on npmjs.com; otherwise the
# NPM_TOKEN repository secret.
#
# First publish of the name: npm cannot configure a trusted publisher for a
# package that does not exist yet, and bypass-2FA tokens are deprecated
# (direct publishing with them ends ~January 2027). Dispatch with stage=true
# and a stage-only granular access token in NPM_TOKEN: `npm stage publish`
# creates the package and queues the version; a maintainer approves it on
# npmjs.com (Staged Packages tab, 2FA) and only then does it go live. Then
# configure trusted publishing for later releases and delete the token.
#
# Staging is the DEFAULT (release-triggered runs and manual runs alike): the
# trusted publisher for pgxdb allows `npm stage publish` only, so every
# release gets two human gates — the GitHub environment approval and the
# maintainer's 2FA approval on npmjs.com. Direct `npm publish` needs an
# explicit manual dispatch with stage=false (and a trusted publisher that
# allows it).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (without the leading v; the GitHub release must already be published)
        required: true
      dry_run:
        description: Pack and verify only, do not publish
        type: boolean
        default: true
      stage:
        description: "Stage for maintainer approval on npmjs.com (npm stage publish). Default. Set to false for a direct npm publish (needs a trusted publisher that allows it)."
        type: boolean
        default: true
      registry_check:
        description: Also run the clean-machine check of this version from the registry (use with dry_run after a staged version was approved)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'pgrundev/pgx'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Resolve and validate the release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          tag="${RELEASE_TAG:-v${INPUT_VERSION#v}}"
          version="${tag#v}"
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::tag '$tag' is not vX.Y.Z[-pre]; refusing to publish" >&2; exit 1; }
          json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish)"
          [ "$(echo "$json" | jq -r .isDraft)" = false ] \
            || { echo "::error::release $tag is a draft; publish it on GitHub first" >&2; exit 1; }
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          git fetch -q origin main
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::tag $tag ($sha) is not on main; npm packages are published from main releases only" >&2; exit 1; }
          prerelease="$(echo "$json" | jq -r .isPrerelease)"
          dist_tag="$([ "$prerelease" = true ] && echo beta || echo latest)"
          { echo "version=$version"; echo "tag=$tag"; echo "dist_tag=$dist_tag"; } >> "$GITHUB_OUTPUT"
          echo "pgxdb@$version from release $tag ($sha, on main) -> dist-tag $dist_tag"
      - name: Release assets must exist for every supported platform
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -eu
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          for t in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            for f in "pgx-$VERSION-$t.tar.gz" "pgx-$VERSION-$t.tar.gz.sha256"; do
              echo "$assets" | grep -qx "$f" || { echo "::error::release $TAG lacks $f" >&2; exit 1; }
            done
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Stamp the package version from the release
        working-directory: dist/npm
        env: { VERSION: "${{ steps.resolve.outputs.version }}" }
        run: |
          # --allow-same-version: package.json already carries the release version
          # when it was bumped before tagging; npm otherwise exits 1 ("Version not changed").
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          cp ../../LICENSE .
      - name: Package tests
        working-directory: dist/npm
        run: npm test
      - name: Pack, then smoke the packed tarball against the real release (download, run, stop)
        working-directory: dist/npm
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          PGX_HOME: ${{ runner.temp }}/pgx-home
          PGX_INSTALL_DIR: ${{ runner.temp }}/pgx-dist
        run: |
          set -eu
          npm pack
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null && npm install "$GITHUB_WORKSPACE/dist/npm/pgxdb-$VERSION.tgz"
          npx pgxdb | tee run.out
          grep -q "PGX is ready" run.out
          npx pgxdb --json ls | grep -q '"app"'
          npx pgxdb version | grep -q "$VERSION"
          npx pgxdb stop
      - uses: actions/upload-artifact@v4
        with:
          name: pgxdb-package
          path: dist/npm/pgxdb-*.tgz

  publish:
    needs: verify
    if: github.repository == 'pgrundev/pgx' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    # Human approval gate: add required reviewers to this environment in
    # Settings → Environments → npm-publish. The job waits for them.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: pgxdb-package, path: pkg }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Publish (or stage) exactly the verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
          STAGE: ${{ github.event.inputs.stage }}
        run: |
          set -eu
          # With trusted publishing configured, NODE_AUTH_TOKEN is empty and npm
          # uses OIDC; setup-node's .npmrc line must then not force a token.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then unset NODE_AUTH_TOKEN; sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"; fi
          # ./ is required: a bare "pkg/pgxdb-0.1.0.tgz" is parsed by npm as the
          # GitHub shorthand github:pkg/pgxdb-0.1.0.tgz (EALLOWGIT on npm >= 11.8).
          # Release-triggered runs have no inputs (STAGE empty): they stage.
          if [ "${STAGE:-true}" != false ]; then
            # Queued for approval on npmjs.com; nothing is installable until a
            # maintainer approves with 2FA. Creates the package if it is new.
            npm stage publish ./pkg/pgxdb-*.tgz --access public --tag "$DIST_TAG"
            echo "::notice::staged pgxdb for approval: npmjs.com → Staged Packages (or \`npm stage list pgxdb\` / \`npm stage approve <stage-id>\`)"
          else
            npm publish ./pkg/pgxdb-*.tgz --provenance --access public --tag "$DIST_TAG"
          fi

  verify-clean-machine:
    # After a real publish: `npx pgxdb@<version>` from the registry on a clean
    # ubuntu:24.04 container with NO PostgreSQL and NO Docker, as an
    # unprivileged user — what a new developer's machine looks like.
    # Not after a staged publish (nothing is installable until approval); run
    # it afterwards with dry_run=true registry_check=true.
    needs: [verify, publish]
    if: always() && needs.verify.result == 'success' && ((needs.publish.result == 'success' && github.event.inputs.stage == 'false') || github.event.inputs.registry_check == 'true')
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Clean base — Node.js only (no postgres, no docker)
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm ca-certificates procps
          if command -v postgres || command -v initdb || command -v psql || command -v docker; then
            echo "::error::this is not a clean machine" >&2; exit 1; fi
          useradd -m -u 10001 fresh
      - name: npx pgxdb@$VERSION as a fresh unprivileged user
        run: |
          set -eu
          # Wait for the registry to serve the new version (propagation delay).
          for i in $(seq 1 30); do
            if npm view "pgxdb@$VERSION" version >/dev/null 2>&1; then break; fi
            [ "$i" = 30 ] && { echo "::error::pgxdb@$VERSION not visible on npm after 5 minutes" >&2; exit 1; }
            sleep 10
          done
          runuser -u fresh -- sh -c "
            set -eu; cd ~
            npx -y pgxdb@$VERSION | tee run.out
            grep -q 'PGX is ready' run.out
            npx -y pgxdb@$VERSION --json ls | grep -q '\"app\"'
            npx -y pgxdb@$VERSION version | grep -q '$VERSION'
            npx -y pgxdb@$VERSION stop
          "
