name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without the leading v)
        required: true
# Builds the per-platform artifacts, runs the lifecycle suite against the
# PACKAGED artifact (not a dev binary), and uploads a DRAFT release with
# checksums. Publishing the draft is a manual step (never automated).
permissions:
  contents: write
jobs:
  # Public release artifacts are built from main only: refuse a tag that does
  # not point at a commit on the main branch (e.g. a tag pushed from prod or a
  # feature branch). prod is deployed by PGRun from internal builds, never from
  # these public release artifacts.
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag must be an ancestor of origin/main
        run: |
          git fetch origin main --depth=0 || git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ok: $GITHUB_SHA is on main"
          else
            echo "::error::refusing to release $GITHUB_SHA — it is not on main. Public releases are cut from main only." >&2
            exit 1
          fi
  build:
    needs: guard
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-14,         target: darwin-arm64 }
          - { os: macos-15-intel,   target: darwin-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        run: echo "VERSION=${GITHUB_REF_NAME#v}${{ github.event.inputs.version && format('{0}', github.event.inputs.version) || '' }}" >> "$GITHUB_ENV"
      - name: Install PostgreSQL 18 and RE2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo wget -qO /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18 libre2-dev pkg-config build-essential
          echo "PG18_BINDIR=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - name: Install PostgreSQL 18 and build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          # No `brew re2`: Homebrew ships abseil as dylibs only, which would make
          # the engine link ~65 absl dylibs by absolute path (not self-contained,
          # issue #10). We build a STATIC re2+abseil prefix instead.
          brew install postgresql@18 pkg-config cmake ninja
          echo "PG18_BINDIR=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
      - name: Cache static re2+abseil prefix (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pgx-static-re2
          key: static-re2-macos-${{ runner.arch }}-absl20260817.0-re2-2025-11-05-v1
      - name: Build static re2+abseil prefix (macOS)
        if: runner.os == 'macOS'
        run: |
          PREFIX="$(PGX_RE2_PREFIX="$RUNNER_TEMP/pgx-static-re2" dist/macos/build-static-re2.sh)"
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.96.0" }
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --bin postgres --bin pgx
      - name: Assemble
        run: dist/assemble.sh --out "$RUNNER_TEMP/rel" --version "$VERSION" --pg-bindir "$PG18_BINDIR"
      - name: Self-contained check (macOS — no non-system dylib deps)
        if: runner.os == 'macOS'
        run: dist/test/macos_selfcontained_test.sh "$(find "$RUNNER_TEMP/rel" -maxdepth 1 -type d -name "pgx-$VERSION-*")"
      - name: Verify the packaged artifact (lifecycle suite)
        run: |
          export PGX_DIST="$(find "$RUNNER_TEMP/rel" -maxdepth 1 -type d -name "pgx-$VERSION-*")"
          cargo test -p pgx --release --test lifecycle --test databases --test clone
      - uses: actions/upload-artifact@v4
        with:
          name: pgx-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/rel/*.tar.gz
            ${{ runner.temp }}/rel/*.tar.gz.sha256
  draft:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect checksums
        run: |
          cd artifacts && find . -name '*.sha256' -exec cat {} \; > ../checksums.txt
          cat ../checksums.txt
      # The release notes live in the repository; without a checkout the
      # action logged `Failed to read body_path "dist/release-notes.md"
      # (ENOENT)` and published an empty body (v0.1.1 and the v0.1.2 draft,
      # which was filled in by hand). Only that one file is needed.
      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: dist/release-notes.md
          sparse-checkout-cone-mode: false
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: PGX ${{ github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
            checksums.txt
          body_path: dist/release-notes.md
