[package]
name = "pgx"
version = "0.1.3"
edition.workspace = true
publish.workspace = true
description = "PGX command-line interface: a local, disposable, PostgreSQL-compatible runtime"

[[bin]]
name = "pgx"
path = "src/main.rs"

[features]
# Test-only fault injection for PGX Git (`PGX_GIT_FAILPOINT`). Off in every
# release build; `cargo test -p pgx --features failpoints --test git` uses it.
failpoints = []

[dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
# `pgx top`: the terminal UI. Default features off: only the crossterm backend
# (no termion/termwiz, no serde, no underline-color/macros extras).
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
unicode-width = "0.2"

[dev-dependencies]
